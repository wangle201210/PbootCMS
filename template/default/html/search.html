{include file=comm/head.html}
<link rel="stylesheet" href="{pboot:sitetplpath}/css/yx-page.css?v=20260606">

<!-- 主体内容 -->
<div class="container">

    <!-- 面包屑 -->
    <div class="breadcrumb">
        {pboot:position separator='<span class="sep">&gt;</span>'}
    </div>

    <div class="page-content">

        <!-- 搜索结果 -->
        <div class="content-area" style="flex:1;">
            <div class="article-list">
                <div class="article-list-header">搜索结果</div>
                <div class="article-list-body">
                	{pboot:search num=10 order=date}
                    <a href="[search:link]" class="article-item">
                        <span class="article-item-title">[search:title mark=1]</span>
                        <span class="article-item-date">[search:date style=Y-m-d]</span>
                    </a>
                    {/pboot:search}
                </div>
            </div>

            <!-- 分页 -->
            {pboot:if({page:rows}>0)}
            <div class="pagination">
            	<a href="{page:index}" class="page-item">首页</a>
            	<a href="{page:pre}" class="page-item">上一页</a>
              	{page:numbar}
              	<a href="{page:next}" class="page-item">下一页</a>
              	<a href="{page:last}" class="page-item">尾页</a>
            </div>
            {else}
            <div style="text-align:center;padding:40px 0;color:#999;">未搜索到相关内容</div>
            {/pboot:if}

        </div>

    </div>
</div>

{include file=comm/foot.html}
